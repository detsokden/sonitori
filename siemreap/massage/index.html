<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sonitori · Massage</title>
    <link rel="icon" type="image/png" href="../../uploads/top-logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: #FAF8F4;
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        .header .badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #C9A66B;
            margin-bottom: 6px;
        }
        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(32px, 5vw, 48px);
            font-weight: 600;
            color: #12343B;
            letter-spacing: -0.01em;
        }
        .header h1 span {
            color: #038494;
            font-style: italic;
        }
        .header p {
            color: #5a5a5a;
            font-size: 15px;
            font-weight: 300;
            margin-top: 6px;
        }

        /* Single Image Card */
        .card {
            background: #FFFFFF;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 12px 48px rgba(18, 52, 59, 0.08);
            position: relative;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }


        .card img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
            background: #f8f6f2;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        .card img.loaded {
            opacity: 1;
        }

        /* ===== LOADING SKELETON ===== */
        .card .skeleton {
            position: absolute;
            inset: 0;
            background: #f0ede8;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s ease;
            border-radius: 20px;
            z-index: 1;
        }

        .card .skeleton.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .card .skeleton .spinner {
            width: 44px;
            height: 44px;
            border: 3.5px solid rgba(201, 166, 107, 0.15);
            border-top-color: #C9A66B;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Skeleton shimmer */
        .card .skeleton .pulse {
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.3) 50%, transparent 100%);
            animation: shimmer 1.8s ease-in-out infinite;
            border-radius: 20px;
        }

        @keyframes shimmer {
            0% {
                transform: translateX(-100%);
            }
            100% {
                transform: translateX(100%);
            }
        }

        /* Responsive */
        @media (max-width: 600px) {
            body {
                padding: 20px 12px;
            }
            .card .skeleton .spinner {
                width: 36px;
                height: 36px;
                border-width: 3px;
            }
            .header {
                margin-bottom: 28px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- Header -->
        <div class="header">
            <div class="badge">✦ Rejuvenate</div>
            <h1>Our <span>Massage</span></h1>
            <p>Relax. Restore. Reconnect.</p>
        </div>

        <!-- Single Image -->
        <div class="card">
            <div class="skeleton" id="skeleton">
                <div class="spinner"></div>
                <div class="pulse"></div>
            </div>
            <img src="Massage-09.png" alt="Sonitori Massage" loading="lazy" id="massageImage" />
        </div>

    </div>

    <script>
        (function() {
            const img = document.getElementById('massageImage');
            const skeleton = document.getElementById('skeleton');

            function onImageLoaded() {
                if (skeleton) {
                    skeleton.classList.add('hidden');
                    setTimeout(() => {
                        skeleton.remove();
                    }, 700);
                }
                img.classList.add('loaded');
                console.log('💆 Massage image loaded');
            }

            if (img.complete && img.naturalWidth > 0) {
                onImageLoaded();
            } else {
                img.addEventListener('load', onImageLoaded);
                img.addEventListener('error', function() {
                    // Still hide skeleton even if image fails
                    if (skeleton) {
                        skeleton.classList.add('hidden');
                        setTimeout(() => skeleton.remove(), 700);
                    }
                    console.warn('⚠️ Massage image failed to load');
                });
            }

            // Fallback: hide skeleton after 8s
            setTimeout(() => {
                if (skeleton && !skeleton.classList.contains('hidden')) {
                    skeleton.classList.add('hidden');
                    setTimeout(() => skeleton.remove(), 700);
                }
            }, 8000);

            console.log('💆 Massage page ready');
        })();
    </script>

</body>
</html>
